project:
  type: website
  output-dir: _site
  resources:
    - assets/**
    - scripts/visitor-stats.js
    - scripts/photo-gallery.js
  render:
    - "*.qmd"
    - "projects/*.qmd"

website:
  title: "Kamruzzaman Joty"
  site-url: "https://kamruzzamanjoty.github.io"
  description: "Research and engineering portfolio of Kamruzzaman Joty"
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card: true
  image: assets/kamruzzaman-joty.jpg
  image-alt: "Portrait of Kamruzzaman Joty"
  navbar:
    background: "#0d2038"
    foreground: "#ffffff"
    left:
      - href: index.qmd
        text: Home
      - href: professional-profile.qmd
        text: Profile
      - href: research.qmd
        text: Research
      - href: experience.qmd
        text: Experience
      - href: engineering-portfolio.qmd
        text: Engineering
      - href: publications.qmd
        text: Publications
      - href: contact.qmd
        text: Contact
      - text: More
        menu:
          - href: journal-covers.qmd
            text: Journal Covers
          - href: talks-news.qmd
            text: Talks & News
          - href: conferences.qmd
            text: Conferences & Seminars
          - href: honors-and-awards.qmd
            text: Honors & Awards
          - href: writing.qmd
            text: Writing
  page-footer:
    left: "© Kamruzzaman Joty"
    right: |
      [BAST Lab](https://bastlabs.org/) · Built with Quarto
  search: true
  back-to-top-navigation: true

format:
  html:
    canonical-url: true
    include-in-header: includes/google-verification.html
    theme: [cosmo, styles/custom.scss]
    css: [styles/site-v3.css, styles/site-media.css]
    toc: true
    smooth-scroll: true
    title-block-banner: false
    lang: en
    link-external-newwindow: true
    page-layout: article
