project:
  type: website
  output-dir: _site
  resources:
    - assets/**
    - scripts/visitor-stats.js
  render:
    - "*.qmd"
    - "projects/*.qmd"

website:
  title: "Kamruzzaman Joty"
  site-url: "https://kamruzzamanjoty.github.io"
  description: "Research and engineering portfolio of Kamruzzaman Joty"
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card: true
  image: assets/kamruzzaman-joty.jpg
  image-alt: "Portrait of Kamruzzaman Joty"
  navbar:
    background: "#0d2038"
    foreground: "#ffffff"
    left:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: covers.qmd
        text: Covers
      - href: talks-news.qmd
        text: Talks & News
      - href: portfolio.qmd
        text: Engineering
      - href: experience.qmd
        text: Experience
      - href: writing.qmd
        text: Writing
      - href: cv.qmd
        text: Profile
      - href: contact.qmd
        text: Contact
  page-footer:
    left: "© Kamruzzaman Joty"
    right: |
      [BAST Lab](https://bastlabs.org/) · Built with Quarto
  search: true
  back-to-top-navigation: true

format:
  html:
    canonical-url: true
    theme: [cosmo, styles/custom.scss]
    css: styles/custom.css
    include-after-body: includes/visitor-stats.html
    toc: true
    smooth-scroll: true
    title-block-banner: false
    lang: en
    link-external-newwindow: true
    page-layout: article
